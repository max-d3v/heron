# Builds the unsigned Windows installer on Windows and keeps it as a workflow artifact (SPEC §17.9).
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version in package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: heron-windows-installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
