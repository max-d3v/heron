# Releases Heron with semantic-release (SPEC §13, §17.9). On every push to main, the commit titles since
# the last release pick the next version: fix → patch, feat → minor, a breaking change → major, and
# anything else releases nothing. When there's a version, both installers are built with it and
# published to a GitHub release under fixed names, so the README's releases/latest/download/... links
# always get the newest build.
#
# Run by hand on any branch, it builds both installers as workflow artifacts. On main it also
# publishes a release if one is due, e.g. to retry after a failed build. Once the release job has
# pushed the v<version> tag, a re-run finds nothing to release: if it fails after that (say, an asset
# upload), delete the tag and its draft release before re-running.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, in push order, so two merges can't claim the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dry run checks it could push the tag
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag and commit, to find the last release
      # Uses the pnpm version in package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # semantic-release needs no install scripts (Electron's download, native builds).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Publishes nothing. scripts/release-version.js writes the version, if any, to the step output.
      - id: next
        run: pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: version
    if: needs.version.outputs.version != '' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          # Each installer travels with its update feed and blockmap, which installed copies read to
          # update themselves (SPEC §13.1).
          - os: macos-latest # Apple silicon
            script: dist
            artifact: heron-macos-dmg
            path: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.dmg.blockmap
              apps/desktop/dist/latest-mac.yml
          - os: windows-latest
            script: dist:win
            artifact: heron-windows-installer
            path: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.exe.blockmap
              apps/desktop/dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app shows this version and sends it to Claude Code. Without a release, the build keeps
      # the version in package.json.
      - name: Stamp the release version
        if: needs.version.outputs.version != ''
        working-directory: apps/desktop
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # .releaserc.json uploads the installers (Heron-mac-arm64.dmg, Heron-windows-x64-setup.exe),
      # their blockmaps and the update feeds (latest-mac.yml, latest.yml).
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # scripts/release-version.js stops the release if the version moved since the build.
          HERON_BUILT_VERSION: ${{ needs.version.outputs.version }}
