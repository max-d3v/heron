appId: dev.heron.desktop
productName: Heron
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # The Agent SDK ships its own Claude Code binaries; Heron runs the user's installed `claude`.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"
      - "skills/**"
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 ships N-API prebuilds that load in Electron as-is.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signed, not notarized. Without any signature, a downloaded copy is "damaged" on
  # Apple silicon; ad-hoc, macOS blocks the first open and Privacy & Security → Open Anyway allows it.
  # Developer ID signing + notarization come later (SPEC §13).
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: alert
dmg:
  title: Heron
# Built on Windows only, by .github/workflows/release.yml. v1 is unsigned (personal use):
# SmartScreen warns on first run (More info → Run anyway).
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Tray icons and taskbar badges, on top of the extraResources above.
  extraResources:
    - from: resources/win
      to: win
      filter:
        - "*.png"
# One click and per-user, so installing needs no admin.
nsis:
  oneClick: true
  perMachine: false
